name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  CMAKE_VERSION: "3.22"
  CXX_STANDARD: "17"
  BUILD_TYPE: "Release"
  COVERAGE_THRESHOLD: "90"

jobs:
  # ──────────────────────────────────────────────
  # Build & Test (Linux)
  # ──────────────────────────────────────────────
  build-test:
    name: Build & Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - { dir: "Lab_1/Game_Fifteen", app: "puzzle_app", test: "puzzle_tests" }
          - { dir: "Lab_1/Post_Machine", app: "post_app", test: "post_tests" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            lcov \
            cppcheck \
            clang-tidy \
            ninja-build

      - name: Configure CMake
        working-directory: ${{ matrix.project.dir }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} \
            -DENABLE_COVERAGE=ON \
            -G Ninja

      - name: Build
        working-directory: ${{ matrix.project.dir }}
        run: cmake --build build --verbose

      - name: Run tests
        working-directory: ${{ matrix.project.dir }}
        run: |
          ctest --test-dir build --output-on-failure --verbose

      - name: Generate coverage report
        working-directory: ${{ matrix.project.dir }}
        if: always()
        run: |
          cmake --build build --target coverage 2>/dev/null || true
          # Move report to standard location for upload
          if [ -d build/coverage_report ]; then
            mkdir -p ${{ runner.temp }}/coverage/${{ matrix.project.app }}
            cp -r build/coverage_report/* ${{ runner.temp }}/coverage/${{ matrix.project.app }}/
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.project.app }}
          path: ${{ runner.temp }}/coverage/${{ matrix.project.app }}/
          retention-days: 7

      - name: Check coverage threshold
        working-directory: ${{ matrix.project.dir }}
        if: always()
        run: |
          if [ -f build/coverage_report/index.html ]; then
            # Extract line coverage percentage from lcov summary
            COV=$(lcov --summary build/coverage.info 2>/dev/null | grep "lines" | sed -E 's/.*lines\.\.\.: ([0-9.]+)%.*/\1/' || echo "0")
            echo "Coverage: ${COV}%"
            if (( $(echo "${COV} < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "::error::Coverage ${COV}% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
              exit 1
            fi
          else
            echo "::warning::Coverage report not found"
          fi

      - name: Static analysis (cppcheck)
        working-directory: ${{ matrix.project.dir }}
        run: |
          cppcheck --enable=all --std=c++17 \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            --error-exitcode=1 \
            --quiet \
            src/ include/ 2>&1 | tee cppcheck.log

      - name: Static analysis (clang-tidy)
        working-directory: ${{ matrix.project.dir }}
        run: |
          if [ -f build/compile_commands.json ]; then
            clang-tidy -p build src/*.cpp include/*.h 2>&1 | tee clang-tidy.log || true
            # Fail on errors (not warnings)
            if grep -q "error:" clang-tidy.log; then
              echo "::error::clang-tidy found errors"
              exit 1
            fi
          else
            echo "::warning::compile_commands.json not found, skipping clang-tidy"
          fi

  # ──────────────────────────────────────────────
  # Build Release Artifacts (Linux x64)
  # ──────────────────────────────────────────────
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'release' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        project:
          - { dir: "Lab_1/Game_Fifteen", app: "puzzle_app", name: "fifteen-puzzle" }
          - { dir: "Lab_1/Post_Machine", app: "post_app", name: "post-machine" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            ninja-build \
            patchelf

      - name: Configure CMake (Release)
        working-directory: ${{ matrix.project.dir }}
        run: |
          cmake -S . -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} \
            -DCMAKE_INSTALL_PREFIX=install \
            -G Ninja

      - name: Build Release
        working-directory: ${{ matrix.project.dir }}
        run: cmake --build build-release --verbose

      - name: Install to staging directory
        working-directory: ${{ matrix.project.dir }}
        run: |
          DESTDIR=${{ runner.temp }}/${{ matrix.project.name }} cmake --install build-release

      - name: Bundle dependencies (patchelf for portability)
        working-directory: ${{ matrix.project.dir }}
        run: |
          APP_PATH="${{ runner.temp }}/${{ matrix.project.name }}/usr/local/bin/${{ matrix.project.app }}"
          if [ -f "$APP_PATH" ]; then
            # Create a self-contained bundle directory
            BUNDLE_DIR="${{ runner.temp }}/${{ matrix.project.name }}-bundle"
            mkdir -p "$BUNDLE_DIR/bin"
            cp "$APP_PATH" "$BUNDLE_DIR/bin/"
            # Copy required shared libs (excluding system libs)
            ldd "$APP_PATH" | grep "=> /" | awk '{print $3}' | while read lib; do
              if [[ "$lib" == /usr/lib* ]] || [[ "$lib" == /lib* ]]; then
                continue
              fi
              cp "$lib" "$BUNDLE_DIR/bin/" 2>/dev/null || true
            done
            # Create launch script that sets LD_LIBRARY_PATH
            cat > "$BUNDLE_DIR/${{ matrix.project.name }}.sh" << 'EOF'
#!/bin/bash
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
export LD_LIBRARY_PATH="$SCRIPT_DIR/bin:${LD_LIBRARY_PATH}"
exec "$SCRIPT_DIR/bin/${{ matrix.project.app }}" "$@"
EOF
            chmod +x "$BUNDLE_DIR/${{ matrix.project.name }}.sh"
            # Create tarball
            cd "${{ runner.temp }}"
            tar -czf "${{ matrix.project.name }}-linux-x64.tar.gz" -C "$BUNDLE_DIR" .
            echo "ARTIFACT_PATH=${{ runner.temp }}/${{ matrix.project.name }}-linux-x64.tar.gz" >> $GITHUB_OUTPUT
          fi
        id: bundle

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-linux-x64
          path: ${{ steps.bundle.outputs.ARTIFACT_PATH }}
          retention-days: 30

  # ──────────────────────────────────────────────
  # Publish to GitHub Releases
  # ──────────────────────────────────────────────
  publish-release:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/artifacts/*/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Coverage Summary (PR Comment)
  # ──────────────────────────────────────────────
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/coverage
          pattern: coverage-*
          merge-multiple: true

      - name: Generate coverage summary
        run: |
          echo "## Coverage Report" > coverage-summary.md
          echo "" >> coverage-summary.md
          echo "| Project | Line Coverage |" >> coverage-summary.md
          echo "|---------|---------------|" >> coverage-summary.md
          for dir in ${{ runner.temp }}/coverage/*/; do
            if [ -f "$dir/index.html" ]; then
              PROJECT=$(basename "$dir")
              # Find the .info file
              INFO_FILE=$(find "$dir" -name "*.info" | head -1)
              if [ -n "$INFO_FILE" ]; then
                COV=$(lcov --summary "$INFO_FILE" 2>/dev/null | grep "lines" | sed -E 's/.*lines\.\.\.: ([0-9.]+)%.*/\1/' || echo "N/A")
                echo "| $PROJECT | ${COV}% |" >> coverage-summary.md
              fi
            fi
          done
          cat coverage-summary.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('${{ runner.temp }}/coverage-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            })